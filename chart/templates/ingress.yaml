# One host: /api, /admin and /static go to the API, everything else to the site.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ta.name" . }}
  labels:
    {{- include "ta.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          {{- range list "/api" "/admin" "/static" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "ta.name" $ }}-api
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ta.name" $ }}-web
                port:
                  name: http
