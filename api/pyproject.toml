[project]
name = "travel-agency-api"
version = "0.1.0"
description = "Travel agency backend: weather, locations by temperature bracket, tour packages with dated departures and bookings."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django~=5.2",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["."]
python_files = ["test_*.py"]
